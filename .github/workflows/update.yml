name: Update AUR packages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Update packages
        run: ./update.sh

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Update Devsy packages"
          title: "Update Devsy to latest release"
          body: |
            Automated update to the latest Devsy release.
          branch: update-devsy
          delete-branch: true
